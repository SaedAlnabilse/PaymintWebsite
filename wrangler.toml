name = "paymintwebsite"
compatibility_date = "2024-09-23"
main = "src/worker.ts"

# Non-secret public config only. Secrets (QA_ACCESS_KEY, API tokens) must be set
# via Cloudflare dashboard → Workers → mintcom → Settings → Variables
# or: npx wrangler secret put QA_ACCESS_KEY
# Never commit secrets here.

[assets]
directory = "dist"
binding = "ASSETS"

[vars]
# Public backend origin for the Worker API proxy (not a credential).
API_TARGET = "https://api.mintcompos.com"
# Public GA4 measurement ID (safe to expose in the browser).
VITE_GA_MEASUREMENT_ID = "G-QHV2SVCG99"
# Maintenance lock at the edge: "true" | "false". Default off.
MAINTENANCE_MODE = "false"
